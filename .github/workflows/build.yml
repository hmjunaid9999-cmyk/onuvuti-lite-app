name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'crash.txt'
      - 'sha1.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html notify.js icon-192.png icon-512.png www/
          cp admin.html www/ 2>/dev/null || true
      - run: npm install
      - run: npx cap add android
      - run: cp google-services.json android/app/google-services.json
      - name: Enable Google sign-in in plugin
        run: |
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          cat android/variables.gradle
      - name: Camera and microphone permissions
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml
      - name: App icon
        run: |
          sudo apt-get install -y -qq imagemagick || true
          RES=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p $RES/mipmap-$n
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
          done
          for d in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            n=${d%%:*}; s=${d##*:}; inner=$((s*66/100))
            convert icon-512.png -resize ${inner}x${inner} -background none -gravity center -extent ${s}x${s} $RES/mipmap-$n/ic_launcher_foreground.png
          done
          sed -i 's/#FFFFFF/#000000/I' $RES/values/ic_launcher_background.xml || true
          cat $RES/values/ic_launcher_background.xml || true
          ls -R $RES | head -60
      - name: Keystore
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -keystore keystore.jks -alias onuvuti -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Onuvuti Lite"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore.jks
            git commit -m "add keystore [skip ci]"
            git push
          fi
      - name: Signing and version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOT'
          android {
            signingConfigs {
              release {
                storeFile file("../../keystore.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "onuvuti"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOT
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk onuvuti-lite.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Onuvuti Lite v${{ github.run_number }}
          files: onuvuti-lite.apk
