name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html notify.js icon-192.png icon-512.png www/
          cp admin.html www/ 2>/dev/null || true
      - run: npm install
      - run: npx cap add android
      - run: cp google-services.json android/app/google-services.json
      - name: Keystore
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -keystore keystore.jks -alias onuvuti -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Onuvuti Lite"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore.jks
            git commit -m "add keystore [skip ci]"
            git push
          fi
      - name: Signing and version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                storeFile file("../../keystore.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "onuvuti"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk onuvuti-lite.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Onuvuti Lite v${{ github.run_number }}
          files: onuvuti-lite.apk
