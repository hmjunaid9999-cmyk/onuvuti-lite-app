name: Crash log
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/crash.yml'
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern onuvuti-lite.apk --repo ${{ github.repository }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: |
            adb install -r onuvuti-lite.apk
            adb logcat -c
            adb shell monkey -p com.onuvuti.lite -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d > full.txt
      - name: Save crash log
        run: |
          grep -E "FATAL|AndroidRuntime|Caused by|Capacitor|FirebaseApp|onuvuti" full.txt | head -60 > crash.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add crash.txt
          git commit -m "add crash log [skip ci]"
          git push
